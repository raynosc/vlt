version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA9003"

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
