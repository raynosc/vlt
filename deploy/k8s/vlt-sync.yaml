apiVersion: v1
kind: Namespace
metadata:
  name: vlt
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vlt-sync-pvc
  namespace: vlt
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlt-sync
  namespace: vlt
  labels:
    app: vlt-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vlt-sync
  template:
    metadata:
      labels:
        app: vlt-sync
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: vlt-sync
          image: vlt-sync:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: https
          env:
            - name: VLT_SYNC_ADDR
              value: ":8443"
            - name: VLT_SYNC_DB_PATH
              value: "/data/sync.db"
            - name: VLT_SYNC_TLS_CERT
              value: "/certs/tls.crt"
            - name: VLT_SYNC_TLS_KEY
              value: "/certs/tls.key"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls-certs
              mountPath: /certs
              readOnly: true
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vlt-sync-pvc
        - name: tls-certs
          secret:
            secretName: vlt-sync-tls
---
apiVersion: v1
kind: Service
metadata:
  name: vlt-sync
  namespace: vlt
  labels:
    app: vlt-sync
spec:
  type: ClusterIP
  ports:
    - port: 8443
      targetPort: 8443
      name: https
  selector:
    app: vlt-sync
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vlt-sync
  namespace: vlt
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sync.tudominio.com
      secretName: vlt-sync-tls
  rules:
    - host: sync.tudominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vlt-sync
                port:
                  number: 8443
